version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: secops-db
    environment:
      POSTGRES_USER: secops_user
      POSTGRES_PASSWORD: secops_password
      POSTGRES_DB: secops_pulse
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secops_user -d secops_pulse"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: secops-backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://secops_user:secops_password@db:5432/secops_pulse
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - AI_MODEL=gemini-1.5-flash
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

  # Frontend Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: secops-frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app

volumes:
  postgres_data:
